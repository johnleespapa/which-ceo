const T={ko:{t:"나는 어떤 CEO일까?",h:"나는 어떤 CEO일까?",sub:"버튼 한 번이면 당신 안의 CEO가 나타납니다",go:"내 CEO 확인하기",tag:"당신은 바로...",share:"X에 공유하기",again:"나도 해보기",credit:"이미지: Wikimedia Commons",foot:"재미로 보는 결과입니다",btn:"EN",s:(n,c,b)=>"나는 어떤 CEO일까? 결과: "+n+" ("+c+") - "+b+" 당신은 누구?"},
en:{t:"Which CEO Are You?",h:"Which CEO Are You?",sub:"One tap reveals the CEO inside you",go:"Find my CEO",tag:"You are...",share:"Share on X",again:"Try it yourself",credit:"Image: Wikimedia Commons",foot:"Just for fun",btn:"한",s:(n,c,b)=>"Which CEO am I? "+n+" ("+c+") - "+b+" Who are you?"}};
function store(k,v){try{v===undefined?0:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}}
function pickLang(){const p=new URLSearchParams(location.search).get("lang");if(p==="en"||p==="ko")return p;const s=store(LKEY);if(s==="en"||s==="ko")return s;return /^ko/i.test(navigator.language||"")?"ko":"en"}
let lang=pickLang();store(LKEY,lang);
function seed(){let s=store(KEY);if(s===null){s=String(Math.floor(Math.random()*1e9));store(KEY,s)}return parseInt(s,10)||0}
function initials(e){return e.split(" ").map(w=>w[0]).join("").slice(0,2)}
const base=()=>location.origin+location.pathname.replace(/index\.html$/,"");
let cur=null,idx=0;
function render(){const L=T[lang];document.documentElement.lang=lang;document.title=L.t;
 document.querySelectorAll("[data-i]").forEach(el=>el.textContent=L[el.dataset.i]);
 document.getElementById("lang").textContent=L.btn;
 const u=base()+"?lang="+lang;document.getElementById("again").href=u;
 if(cur){const c=cur,en=lang==="en",n=en?c.e:c.k,b=en?c.be:c.b;
  document.getElementById("nm").textContent=n;document.getElementById("en").textContent=en?c.k:c.e;
  document.getElementById("co").textContent=c.c;document.getElementById("bl").textContent=b;
  const g=id=>document.getElementById(id);g("bio").textContent=en?c.bioe:c.biok;g("cdesc").textContent=en?c.cde:c.cdk;g("tk").textContent=c.tk;
  if(c.priv){g("px").textContent="";g("mc").textContent="";g("asof").textContent="";}
  else{g("px").textContent=(en?"Price ":"주가 ")+(c.px||(en?"unavailable":"정보 없음"));g("mc").textContent=(en?"Market cap ":"시가총액 ")+(c.mc||(en?"unavailable":"정보 없음"));g("asof").textContent=(en?"as of ":"기준일 ")+c.asof+" · Yahoo Finance";}
  document.getElementById("share").href="https://x.com/intent/post?text="+encodeURIComponent(L.s(n,c.c,b))+"&url="+encodeURIComponent(base()+"r/"+idx+"-"+lang+".html");}}
function show(){idx=seed()%CEOS.length;cur=CEOS[idx];const c=cur,f=document.getElementById("face");f.textContent="";
 const im=new Image();im.alt=c.e;im.referrerPolicy="no-referrer";im.src=c.img;im.onerror=()=>{f.textContent=initials(c.e)};f.appendChild(im);
 document.getElementById("go").style.display="none";document.getElementById("card").style.display="block";render()}
document.getElementById("go").addEventListener("click",show);
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ko"?"en":"ko";store(LKEY,lang);history.replaceState(null,"",base()+"?lang="+lang);render()});
render();
</script></body></html>
